<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Specifications — RE-CONE</title>
  <meta name="description" content="Verified technical specifications, hardware benchmarks, and editorial trade-off review on RE-CONE.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111111'/><text x='16' y='21' font-family='serif' font-size='16' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>R</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Compact Phone Detail Window Styles */
    .phone-page-body {
      background-color: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .phone-page-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      padding: 0.85rem 0;
    }

    .phone-page-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .phone-spec-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem 1.5rem;
      width: 100%;
    }

    .phone-hero-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-dark);
      padding: 2.25rem;
      margin-bottom: 2rem;
    }

    .phone-hero-brand {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .phone-hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }

    .phone-hero-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-light);
      margin-top: 1.25rem;
    }

    .phone-hero-price {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .spec-group-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .spec-group-header {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-primary);
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-medium);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .spec-table-compact {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }

    .spec-table-compact tr {
      border-bottom: 1px solid var(--border-light);
    }

    .spec-table-compact tr:last-child {
      border-bottom: none;
    }

    .spec-table-compact td {
      padding: 0.65rem 0;
      font-family: var(--font-mono);
    }

    .spec-table-compact td:first-child {
      color: var(--text-muted);
      width: 38%;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .spec-table-compact td:last-child {
      color: var(--text-primary);
      font-weight: 600;
    }

    .editorial-box {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-medium);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .editorial-verdict-quote {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-style: italic;
      color: var(--text-primary);
      line-height: 1.55;
      margin-bottom: 1.25rem;
      padding-left: 1rem;
      border-left: 2px solid var(--border-dark);
    }

    .pros-cons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .pro-column, .con-column {
      font-size: 0.8125rem;
      line-height: 1.5;
    }

    .pro-column strong {
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      display: block;
      margin-bottom: 0.35rem;
    }

    .con-column strong {
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      display: block;
      margin-bottom: 0.35rem;
    }

    .pro-column ul, .con-column ul {
      padding-left: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    @media (max-width: 600px) {
      .phone-spec-container {
        padding: 1.25rem 1rem 3rem 1rem;
      }
      .phone-hero-card, .spec-group-box, .editorial-box {
        padding: 1.25rem;
      }
      .pros-cons-grid {
        grid-template-columns: 1fr;
      }
      .spec-table-compact td:first-child {
        width: 45%;
      }
    }
  </style>
</head>
<body class="phone-page-body">

  <!-- ==================== STICKY TOP NAV ==================== -->
  <header class="phone-page-header">
    <div class="container phone-page-header-inner">
      <a href="index.html" class="brand-logo" style="text-decoration: none;">
        <span class="brand-title" style="font-size: 1.35rem;">RE-CONE</span>
        <span class="brand-tag">SPEC SHEET</span>
      </a>

      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <a href="index.html#spec-matrix-explorer" class="btn btn-outline btn-sm">← Back to Catalog</a>
        <button type="button" id="close-window-btn" class="btn btn-primary btn-sm" title="Close this window">✕ Close</button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="phone-spec-container">
    <div id="phone-content-slot">
      <div style="text-align: center; padding: 4rem 1rem; font-family: var(--font-mono); color: var(--text-muted);">
        Loading smartphone specifications...
      </div>
    </div>
  </main>

  <footer style="margin-top: auto; border-top: 1px solid var(--border-light); background-color: var(--bg-card); padding: 1.5rem 0; text-align: center; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);">
    <div class="container">
      © 2026 RE-CONE Platform · Objective Hardware Analysis · Zero Marketing Fluff
    </div>
  </footer>

  <script type="module" src="/src/phone.js"></script>
</body>
</html>
